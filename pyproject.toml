[project]
name = "homeharvest"
version = "2.1.0.dev0"
description = "Python library for US property data: for sale, sold, pending, rentals, open houses and listing agent contacts"
authors = [
    { name = "Zachary Hampton", email = "zachary@bunsly.com" },
    { name = "Cullen Watson", email = "cullen@bunsly.com" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "property data",
    "real estate",
    "sold comps",
    "open houses",
    "mls",
    "real estate api",
    "python",
    "rentals",
    "real estate agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # HTTP/2 client (pydantic's httpx fork): one pooled connection carries concurrent requests.
    # Under Pyodide (Cloudflare Python Workers) requests go through JS fetch instead, and pandas
    # is optional there (only return_type="pandas" needs it).
    "httpx2[http2]>=2.16.2,<3.0.0; sys_platform != 'emscripten'",
    "pandas>=2.3.1,<3.0.0; sys_platform != 'emscripten'",
    "pydantic>=2.11.7,<3.0.0",
    "tenacity>=9.1.2,<10.0.0",
]

[project.urls]
Homepage = "https://homeharvestdata.com"
Source = "https://github.com/ZacharyHampton/HomeHarvest"
Issues = "https://github.com/ZacharyHampton/HomeHarvest/issues"
Docs = "https://homeharvestdata.com"
Changelog = "https://github.com/ZacharyHampton/HomeHarvest/blob/master/CHANGELOG.md"

[tool.poetry]
packages = [{ include = "homeharvest" }]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.2"
pytz = ">=2024.1"
pre-commit = "^3.7.0"

[tool.pytest.ini_options]
markers = [
    "live: hits the live property data API (slow, needs network)",
]

[build-system]
requires = ["poetry-core>=2.1.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
